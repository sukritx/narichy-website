<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Finy Secret intimate care capsules carton</title>
  <desc id="desc">A deep red Narichy carton for Finy Secret intimate care capsules, shown on a warm cream background with two capsules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7f2"/>
      <stop offset="1" stop-color="#f1e8de"/>
    </linearGradient>
    <linearGradient id="tin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c21d33"/>
      <stop offset=".55" stop-color="#951224"/>
      <stop offset="1" stop-color="#6e0b1a"/>
    </linearGradient>
    <linearGradient id="tinSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d0d1c"/>
      <stop offset="1" stop-color="#570711"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#f7efe8"/>
      <stop offset="1" stop-color="#e6d8cb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#3b231b" flood-opacity=".18"/>
    </filter>
    <filter id="capsuleShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#3b231b" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="810" cy="218" r="150" fill="#f3d9d1" opacity=".55"/>
  <circle cx="210" cy="750" r="120" fill="#f7dfd6" opacity=".55"/>

  <ellipse cx="492" cy="842" rx="268" ry="44" fill="#3b231b" opacity=".13"/>

  <g filter="url(#shadow)">
    <path d="M250 270 H622 L670 322 V778 H250 Z" fill="url(#tin)"/>
    <path d="M622 270 L670 322 H622 Z" fill="#5b0814"/>
    <path d="M622 322 V778 H670 V322 Z" fill="url(#tinSide)"/>
    <path d="M250 270 H622 L670 322 V778 H250 Z" fill="url(#shine)"/>
    <path d="M250 270 H622" stroke="#e8b9a6" stroke-opacity=".35"/>
    <rect x="250" y="270" width="5" height="508" fill="#48050f" opacity=".35"/>

    <text x="430" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="78" fill="#ffffff">N</text>
    <text x="430" y="386" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" letter-spacing="7" fill="#ffffff">NARICHY</text>
    <text x="430" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="5" fill="#efc7bb">THAILAND</text>

    <text x="430" y="512" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#ffffff">Finy</text>
    <text x="430" y="590" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="82" fill="#f6d7cd">Secret</text>
    <line x1="330" y1="624" x2="530" y2="624" stroke="#f6d7cd" stroke-opacity=".55"/>
    <text x="430" y="660" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#ffffff">INTIMATE CARE CAPSULES</text>
    <text x="430" y="718" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#efc7bb">6 CAPSULES · THAILAND</text>

    <circle cx="430" cy="752" r="15" fill="none" stroke="#f6d7cd" stroke-opacity=".65"/>
    <text x="430" y="757" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#f6d7cd">N</text>
  </g>

  <g filter="url(#capsuleShadow)" transform="translate(642 640) rotate(-18)">
    <rect width="150" height="64" rx="32" fill="url(#cap)"/>
    <path d="M75 0 H118 A32 32 0 0 1 118 64 H75 Z" fill="#c21d33"/>
    <rect x="9" y="9" width="58" height="14" rx="7" fill="#ffffff" opacity=".55"/>
  </g>
  <g filter="url(#capsuleShadow)" transform="translate(658 742) rotate(14)">
    <rect width="150" height="64" rx="32" fill="url(#cap)"/>
    <path d="M75 0 H118 A32 32 0 0 1 118 64 H75 Z" fill="#c21d33"/>
    <rect x="9" y="9" width="58" height="14" rx="7" fill="#ffffff" opacity=".55"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Finy Secret intimate care capsules</title>
  <desc id="desc">Soft ivory capsules arranged on a deep red background with the Finy Secret wordmark.</desc>
  <defs>
    <radialGradient id="bg" cx=".32" cy=".22" r=".95">
      <stop offset="0" stop-color="#c82338"/>
      <stop offset=".55" stop-color="#991325"/>
      <stop offset="1" stop-color="#660a18"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".68" stop-color="#f7efe8"/>
      <stop offset="1" stop-color="#e3d2c2"/>
    </linearGradient>
    <linearGradient id="redCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e24a5e"/>
      <stop offset="1" stop-color="#a91129"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#2c050b" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="500" cy="500" r="392" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
  <circle cx="500" cy="500" r="312" fill="none" stroke="#ffffff" stroke-opacity=".07"/>

  <g filter="url(#shadow)" transform="translate(235 375) rotate(-24)">
    <rect width="290" height="112" rx="56" fill="url(#cap)"/>
    <path d="M145 0 H234 A56 56 0 0 1 234 112 H145 Z" fill="url(#redCap)"/>
    <rect x="22" y="17" width="100" height="24" rx="12" fill="#ffffff" opacity=".65"/>
  </g>
  <g filter="url(#shadow)" transform="translate(500 565) rotate(9)">
    <rect width="290" height="112" rx="56" fill="url(#cap)"/>
    <path d="M145 0 H234 A56 56 0 0 1 234 112 H145 Z" fill="url(#redCap)"/>
    <rect x="22" y="17" width="100" height="24" rx="12" fill="#ffffff" opacity=".65"/>
  </g>
  <g filter="url(#shadow)" transform="translate(325 690) rotate(-7)">
    <rect width="235" height="92" rx="46" fill="url(#cap)"/>
    <path d="M118 0 H190 A46 46 0 0 1 190 92 H118 Z" fill="url(#redCap)"/>
    <rect x="19" y="14" width="82" height="20" rx="10" fill="#ffffff" opacity=".65"/>
  </g>

  <text x="500" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="9" fill="#ffffff" fill-opacity=".9">NARICHY</text>
  <text x="500" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#ffffff">Finy</text>
  <text x="500" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="92" fill="#f8d9d0">Secret</text>
  <text x="500" y="865" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="6" fill="#f3c8bf">INTIMATE CARE · 6 CAPSULES</text>
</svg>
